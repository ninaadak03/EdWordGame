@if (showToast) {
  <div class="toast">
    {{ toastMessage }}
  </div>
}

<div class="game-container">
  <app-board [board]="board" [shakeRow]="shakeRow"></app-board>

  <app-keyboard [keyStatuses]="keyStatuses" (keyPressed)="handleVirtualKey($event)"> </app-keyboard>
</div>

@if (isGameOver) {
  <div class="modal-backdrop">
    <div class="modal">
      @if (isWin) {
        <h2>You Win!🎉🎉🎉</h2>
        <p>Come back tomorrow for a new puzzle.</p>
      } @else {
        <h2>Oops!</h2>
        <p>The word was:</p>
        <strong>{{ answer }}</strong>
        <br />
        <button (click)="newGame()">New Game</button>
      }
    </div>
  </div>
}
